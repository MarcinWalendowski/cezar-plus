name: Release

# Stable `latest` releases are owner-driven and MANUAL — never a push
# (spec .ai/specs/2026-07-18-npm-preview-publish.md, #482). Pushes to `develop`
# and same-repo PRs publish previews via ci.yml's `publish-snapshot`; only this
# workflow moves the `latest` dist-tag.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (`existing` publishes the version already in package.json)'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - existing

permissions:
  contents: write # commit the version bump + push the tag
  id-token: write # npm provenance attestation

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.bump }} to npm (latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Releases only from main — the stable branch.
    if: github.ref == 'refs/heads/main'
    # Gate the publish behind a required-reviewer approval. If the environment
    # isn't configured yet, GitHub creates it on first use without reviewers
    # (non-blocking); add reviewers at Settings → Environments → production.
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify before release
        run: |
          npm run typecheck
          npm run test:unit
          npm test

      - name: Build application
        run: npm run build

      - name: Publish release
        id: release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release.mjs "${{ inputs.bump }}"

      - name: Commit version bump, tag, and push
        if: steps.release.outputs.published == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json alias-cezar/package.json
          if [ "$BUMP" = "existing" ] && git diff --cached --quiet; then
            echo "existing release: version already committed, nothing to commit"
          else
            git commit -m "chore(release): v${VERSION}"
            git push
          fi
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        if: steps.release.outputs.published == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ steps.release.outputs.version }}
          ROOT_NAME: ${{ steps.release.outputs.rootName }}
          ALIAS_NAME: ${{ steps.release.outputs.aliasName }}
        with:
          script: |
            const version = process.env.RESULT;
            const root = process.env.ROOT_NAME;
            const alias = process.env.ALIAS_NAME;
            const body = [
              '## Published packages',
              '',
              '| Package | Version |',
              '|---|---|',
              `| \`${root}\` | \`${version}\` |`,
              `| \`${alias}\` | \`${version}\` |`,
              '',
              '### Install',
              '',
              '```bash',
              `npx ${alias}@${version}`,
              '```',
            ].join('\n');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `v${version}`,
              body,
              draft: false,
              prerelease: false,
            });

      - name: Write workflow summary
        if: always() && steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISHED: ${{ steps.release.outputs.published }}
          ALIAS_NAME: ${{ steps.release.outputs.aliasName }}
        run: |
          {
            echo "## 🚀 Release ${VERSION}"
            echo ""
            if [ "$PUBLISHED" = "true" ]; then
              echo "Published \`${ALIAS_NAME}@${VERSION}\` to \`latest\` and tagged \`v${VERSION}\`."
            else
              echo "⚠️ Dry run — \`NPM_TOKEN\` is not configured, nothing was published. See \`docs/publishing.md\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
