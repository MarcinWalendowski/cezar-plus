_format_version: "2.1"

# Kong gateway routing for the local Supabase stack. Same path scheme as the
# hosted product so `@supabase/supabase-js` (which builds URLs as
# `{baseUrl}/rest/v1/...`, `{baseUrl}/auth/v1/...`, `{baseUrl}/realtime/v1/...`)
# works against http://127.0.0.1:54321 without any client-side change.
#
# `key-auth` matches the hosted behavior of demanding an `apikey` header on
# every call. The two consumers below ship the well-known dev anon / service
# role JWTs; clients pass them as the `apikey` header AND (for writes) as the
# Authorization bearer so PostgREST picks up the role claim.

consumers:
  - username: anon
    keyauth_credentials:
      - key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  - username: service_role
    keyauth_credentials:
      - key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  - name: realtime-v1
    url: http://realtime:4000/socket/
    protocol: http
    routes:
      - name: realtime-v1-route
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      # supabase/realtime derives the tenant external_id from the Host header
      # (first dot-separated segment). The auto-seeded self-host tenant is
      # `realtime-dev`; by default Kong would forward Host=realtime (the
      # upstream service name) and Realtime would look up a non-existent
      # tenant. We rewrite Host before proxying upstream.
      - name: request-transformer
        config:
          replace:
            headers:
              - "host:realtime-dev"
